name: 每日金融行情日报

on:
  schedule:
    - cron: "0 14 * * *"   # 北京时间 22:00（A股与港股收盘后、美股盘中）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 抓取行情
        run: python scripts/fetch_markets.py
      - name: 提交入库
        run: |
          git config user.name "kb-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add -A
          git diff --staged --quiet || git commit -m "情报：金融行情日报 $(date -u +%F)"
          git push
